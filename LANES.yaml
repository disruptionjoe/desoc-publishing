lane_contract_version: "1.0"
manifest_revision: 1
owner:
  owner_id: desoc-publishing
  display_name: desoc-publishing
  scope_type: repository
  charter_ref: CONSTITUTION.md
  governance_refs:
    - AGENTS.md
    - GOVERNANCE.md
  authoritative_state_refs:
    - STATUS.md
    - ROADMAP.md
    - LANE-STATE.yaml
lanes:
  - id: "1"
    label: Lane 1
    ordinal: 1
    kind: progress
    title: Product opportunity and shaping
    north_star: true
    purpose: Turn producer and consumer needs, feedback, research, failures, and source observations into evidence-supported product hypotheses and ready slices.
    purpose_type: north_star
    execution_posture: automation_eligible
    authoritative_work_refs:
      - RESEARCH.md
      - docs/product
      - docs/plans/active
    forbidden_outputs: &forbidden
      - another repository's canon or authoritative state
      - public deployment or live participation without Joe's authorization
      - new scheduler, trigger, workflow, or cadence
    control:
      state: active
      in_flight_policy: continue_current
      control_revision: 1
      changed_at: "2026-07-23T00:00:00-05:00"
      changed_by: Joe direct chat, 2026-07-23
      authority_ref: founding authorization
  - id: "2"
    label: Lane 2
    ordinal: 2
    kind: progress
    title: Delivery and integration
    north_star: false
    purpose: Implement the smallest ready, reversible product slice and return exact mechanical and behavioral evidence.
    purpose_type: supporting_progress
    execution_posture: automation_eligible
    authoritative_work_refs:
      - docs/product
      - docs/plans/active
      - docs/evaluations
    forbidden_outputs: *forbidden
    control:
      state: active
      in_flight_policy: continue_current
      control_revision: 1
      changed_at: "2026-07-23T00:00:00-05:00"
      changed_by: Joe direct chat, 2026-07-23
      authority_ref: founding authorization
  - id: "3"
    label: Lane 3
    ordinal: 3
    kind: progress
    title: Product evaluation and evolution
    north_star: false
    purpose: Explore actual behavior, compare it with the intended producer and consumer outcome, and keep, revise, revert, or return work to shaping.
    purpose_type: supporting_progress
    execution_posture: automation_eligible
    authoritative_work_refs:
      - docs/evaluations
      - STATUS.md
    forbidden_outputs: *forbidden
    control:
      state: active
      in_flight_policy: continue_current
      control_revision: 1
      changed_at: "2026-07-23T00:00:00-05:00"
      changed_by: Joe direct chat, 2026-07-23
      authority_ref: founding authorization
  - id: A
    label: Lane A
    letter: A
    kind: stewardship
    title: Product and repository stewardship
    north_star: false
    purpose: Keep the product and its agent-development system coherent through audit, recovery, architecture, documentation, security, process learning, and escalation.
    purpose_type: integrated_stewardship
    execution_posture: automation_eligible
    authoritative_work_refs:
      - AGENTS.md
      - GOVERNANCE.md
      - STATUS.md
      - LANE-STATE.yaml
    forbidden_outputs: *forbidden
    control:
      state: active
      in_flight_policy: continue_current
      control_revision: 1
      changed_at: "2026-07-23T00:00:00-05:00"
      changed_by: Joe direct chat, 2026-07-23
      authority_ref: founding authorization
special_rules:
  - Open exploration is Lane-less Discovery until evidence is specific enough for Lane 1.
  - A passing implementation check is candidate evidence, not proof of product improvement.

